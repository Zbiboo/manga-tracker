<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EEF0F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F1F" media="(prefers-color-scheme: dark)">
  <title>Manga Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #EEF0F6;
      --surface: #FFFFFF;
      --ink: #14162B;
      --muted: #62668A;
      --line: #D5D9EA;
      --own-bg: #14162B;
      --own-fg: #F4F5FB;
      --read-bg: #3347FF;
      --read-fg: #FFFFFF;
      --danger: #C42B3A;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0E0F1F;
        --surface: #171933;
        --ink: #ECEEFA;
        --muted: #9A9FC4;
        --line: #2C2F52;
        --own-bg: #ECEEFA;
        --own-fg: #0E0F1F;
        --read-bg: #8B96FF;
        --read-fg: #0B0C1A;
        --danger: #FF7B88;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding-bottom: calc(110px + env(safe-area-inset-bottom));
    }
    main { max-width: 640px; margin: 0 auto; padding: 28px 16px 0; }

    h1 { font-size: 2rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 8px; }
    #total { margin: 0; font-size: 1.125rem; font-weight: 700; }
    .muted { color: var(--muted); font-size: 0.875rem; margin: 4px 0 0; }

    :focus-visible { outline: 3px solid var(--read-bg); outline-offset: 2px; }

    /* Buttons and inputs */
    .btn {
      height: 44px; padding: 0 18px;
      border-radius: 12px; border: 1px solid var(--line);
      background: var(--surface); color: var(--ink);
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .btn.danger { color: var(--danger); }

    input:not([type="checkbox"]):not([type="file"]) {
      height: 44px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: 12px;
      background: var(--paper); color: var(--ink);
      font: inherit; flex: 1 1 140px; min-width: 0;
    }

    /* Account and tools panel */
    .panel { margin: 20px 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
    .panel summary { cursor: pointer; padding: 14px 16px; font-weight: 700; list-style: none; }
    .panel summary::-webkit-details-marker { display: none; }
    .panel summary::after { content: "+"; float: right; font-weight: 400; }
    .panel[open] summary::after { content: "\2013"; }
    .panel[open] summary { border-bottom: 1px solid var(--line); }
    .panel-body { padding: 16px; display: grid; gap: 18px; }
    #login-form, #add-form, .row { display: flex; flex-wrap: wrap; gap: 8px; }

    /* Search and filter */
    .controls { display: grid; gap: 6px; margin: 0 0 8px; }
    .controls input[type="search"] { width: 100%; flex: none; }
    .filter-row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
    .filter-row input { width: 20px; height: 20px; accent-color: var(--read-bg); }
    body:not([data-mode="reading"]) .filter-row { display: none; }

    /* Series shelves */
    .series { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 14px 0; }
    .series-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .series-title { margin: 0; font-size: 1.25rem; font-weight: 900; letter-spacing: -0.01em; }
    .series-count { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
    .ranges { margin: 0; line-height: 1.6; overflow-wrap: anywhere; }

    /* Volume tiles: one per spine on the shelf */
    .volumes { display: flex; flex-wrap: wrap; gap: 6px; }
    .tile {
      position: relative; width: 40px; height: 56px;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid var(--line); border-radius: 6px;
      font-weight: 700; font-size: 0.9rem; font-variant-numeric: tabular-nums;
      cursor: pointer; user-select: none;
      transition: background-color 0.12s, color 0.12s, border-color 0.12s;
    }
    .tile::before {
      content: ""; position: absolute; top: 6px; left: 50%;
      width: 14px; height: 2px; margin-left: -7px;
      background: currentColor; opacity: 0.3; border-radius: 2px;
    }
    .tile input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .tile:focus-within { outline: 3px solid var(--read-bg); outline-offset: 2px; }

    body[data-mode="inventory"] .tile:not(.on) { border-style: dashed; }
    body[data-mode="inventory"] .tile.on { background: var(--own-bg); color: var(--own-fg); border-color: var(--own-bg); }
    body[data-mode="reading"] .tile:not(.on) { border-color: var(--ink); }
    body[data-mode="reading"] .tile.on { background: var(--read-bg); color: var(--read-fg); border-color: var(--read-bg); }

    /* Per-series options */
    .more { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 4px; }
    .more summary { cursor: pointer; padding: 10px 0; color: var(--muted); font-size: 0.9rem; list-style: none; }
    .more summary::-webkit-details-marker { display: none; }
    .more summary::after { content: "+"; float: right; }
    .more[open] summary::after { content: "\2013"; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 6px; }
    .tools .btn { height: 40px; font-size: 0.9rem; }

    .empty { color: var(--muted); text-align: center; padding: 40px 16px; margin: 0; }

    /* Bottom navigation, within thumb reach */
    .modes {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(16px + env(safe-area-inset-bottom));
      display: flex; gap: 4px; padding: 6px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
      box-shadow: 0 8px 24px rgba(20, 22, 43, 0.18);
    }
    .modes button {
      height: 44px; padding: 0 20px; border: 0; border-radius: 999px;
      background: transparent; color: var(--muted);
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .modes button.active { background: var(--ink); color: var(--paper); }

    /* Barcode scanner dialog */
    dialog {
      border: 1px solid var(--line); border-radius: 16px;
      background: var(--surface); color: var(--ink);
      padding: 16px; width: min(92vw, 420px);
    }
    dialog::backdrop { background: rgba(14, 15, 31, 0.6); }
    dialog h2 { margin: 0 0 12px; font-size: 1.25rem; font-weight: 900; }
    #scan-video { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 12px; background: #000; }
    .scan-result { font-size: 1.5rem; font-weight: 900; margin: 8px 0; min-height: 1.5em; font-variant-numeric: tabular-nums; }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body data-mode="inventory">
  <main>
    <header>
      <h1>My manga collection</h1>
      <p id="total"></p>
      <p id="sync-status" class="muted"></p>
    </header>

    <details class="panel">
      <summary>Account and tools</summary>
      <div class="panel-body">
        <div id="auth">
          <form id="login-form">
            <input id="email" type="email" placeholder="Your email" autocomplete="email" required>
            <button class="btn primary">Send login link</button>
          </form>
          <p id="auth-status" class="muted"></p>
          <button id="logout" class="btn" type="button" hidden>Log out</button>
        </div>

        <form id="add-form">
          <input id="title" placeholder="Series title" required>
          <input id="count" type="number" min="1" inputmode="numeric" placeholder="Total volumes" required>
          <button class="btn primary">Add series</button>
        </form>

        <div class="row">
          <button id="export" class="btn" type="button">Export backup</button>
          <button id="import" class="btn" type="button">Import backup</button>
          <input type="file" id="import-file" accept=".json" hidden>
        </div>
      </div>
    </details>

    <div class="controls">
      <input id="search" type="search" placeholder="Search a series">
      <button id="scan-open" class="btn" type="button">Scan a barcode</button>
      <label class="filter-row"><input type="checkbox" id="filter"> Only series with unread volumes</label>
    </div>

    <div id="list"></div>
  </main>

  <nav class="modes" aria-label="View">
    <button type="button" data-mode="inventory">Inventory</button>
    <button type="button" data-mode="reading">Reading</button>
    <button type="button" data-mode="missing">Missing</button>
  </nav>

  <dialog id="scanner">
    <h2>Scan a barcode</h2>
    <video id="scan-video" playsinline muted></video>
    <p id="scan-status" class="muted">Point the camera at the barcode on the back cover.</p>
    <p id="scan-result" class="scan-result"></p>
    <div class="row">
      <button id="scan-again" class="btn" type="button" hidden>Scan another</button>
      <button id="scan-close" class="btn primary" type="button">Close</button>
    </div>
  </dialog>

  <script>
    const SUPABASE_URL = "https://cjhnonzpofziwoyinihp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_8j6RjWcZ2Tig1q_mIYb5Yg_WbF_GIXA";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let data = JSON.parse(localStorage.getItem("manga") || "[]");
    let mode = "inventory";
    let user = null;
    let pushTimer = null;

    // Older entries had no "owned" list: treat all their volumes as owned
    data.forEach(s => { if (!s.owned) s.owned = s.read.map(() => true); });

    /* ---------- Small helpers ---------- */

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function btn(label, onClick, extra) {
      const b = el("button", "btn" + (extra ? " " + extra : ""), label);
      b.type = "button";
      b.onclick = onClick;
      return b;
    }

    function ranges(nums) {
      const out = [];
      let start = null, prev = null;
      nums.forEach(n => {
        if (start === null) { start = prev = n; }
        else if (n === prev + 1) { prev = n; }
        else {
          out.push(start === prev ? `${start}` : `${start}-${prev}`);
          start = prev = n;
        }
      });
      if (start !== null) out.push(start === prev ? `${start}` : `${start}-${prev}`);
      return out.join(", ");
    }

    const EMPTY_TEXT = "No series yet. Open Account and tools, under the title, to add your first one.";

    /* ---------- Saving ---------- */

    function save() {
      localStorage.setItem("manga", JSON.stringify(data));
      localStorage.setItem("manga_updated", new Date().toISOString());
      render();
      pushSoon();
    }

    /* ---------- Rendering ---------- */

    function render() {
      document.body.dataset.mode = mode;
      document.querySelectorAll(".modes button").forEach(b => {
        b.classList.toggle("active", b.dataset.mode === mode);
      });

      if (mode === "missing") { renderMissing(); return; }

      const list = document.getElementById("list");
      const onlyUnread = document.getElementById("filter").checked;
      const query = document.getElementById("search").value.trim().toLowerCase();
      const field = mode === "inventory" ? "owned" : "read";
      list.replaceChildren();
      let ownedTotal = 0, unreadTotal = 0;

      [...data].sort((a, b) => a.title.localeCompare(b.title)).forEach(s => {
        const ownedCount = s.owned.filter(Boolean).length;
        const left = s.owned.filter((o, v) => o && !s.read[v]).length;
        ownedTotal += ownedCount;
        unreadTotal += left;
        if (mode === "reading" && onlyUnread && left === 0) return;
        if (query && !s.title.toLowerCase().includes(query)) return;

        const card = el("section", "series");

        const head = el("div", "series-head");
        head.append(
          el("h2", "series-title", s.title),
          el("span", "series-count", mode === "inventory"
            ? `${ownedCount} of ${s.owned.length} owned`
            : `${left} unread`)
        );
        card.append(head);

        const grid = el("div", "volumes");
        s[field].forEach((val, v) => {
          if (mode === "reading" && !s.owned[v]) return; // only owned volumes can be read
          const tile = el("label", "tile" + (val ? " on" : ""));
          const box = document.createElement("input");
          box.type = "checkbox";
          box.checked = val;
          box.setAttribute("aria-label", `${s.title}, volume ${v + 1}`);
          box.onchange = () => { s[field][v] = box.checked; save(); };
          tile.append(box, el("span", "", String(v + 1)));
          grid.append(tile);
        });
        card.append(grid);

        const more = el("details", "more");
        more.append(el("summary", "", "Options"));
        const tools = el("div", "tools");
        tools.append(
          btn(`Mark ${field} up to…`, () => {
            const n = parseInt(prompt(`Mark as ${field} up to volume number:`));
            if (!n) return;
            for (let v = 0; v < Math.min(n, s[field].length); v++) s[field][v] = true;
            save();
          }),
          btn(`Clear all ${field}`, () => {
            if (confirm(`Clear all "${field}" marks for ${s.title}?`)) {
              s[field] = s[field].map(() => false);
              save();
            }
          }),
          btn("Add volumes…", () => {
            const n = parseInt(prompt(`How many volumes to add to ${s.title}?`, "1"));
            if (!n || n < 1) return;
            for (let k = 0; k < n; k++) { s.owned.push(false); s.read.push(false); }
            save();
          }),
          btn("Delete series", () => {
            if (confirm(`Delete ${s.title}?`)) { data.splice(data.indexOf(s), 1); save(); }
          }, "danger")
        );
        more.append(tools);
        card.append(more);

        list.append(card);
      });

      document.getElementById("total").textContent = mode === "inventory"
        ? `${ownedTotal} volumes on your shelf`
        : `${unreadTotal} owned volumes left to read`;

      if (!list.children.length) {
        list.append(el("p", "empty", data.length ? "No series match your search or filter." : EMPTY_TEXT));
      }
    }

    function renderMissing() {
      const list = document.getElementById("list");
      const query = document.getElementById("search").value.trim().toLowerCase();
      list.replaceChildren();
      let missingTotal = 0;

      [...data].sort((a, b) => a.title.localeCompare(b.title)).forEach(s => {
        const missing = [];
        s.owned.forEach((o, v) => { if (!o) missing.push(v + 1); });
        missingTotal += missing.length;
        if (!missing.length) return;
        if (query && !s.title.toLowerCase().includes(query)) return;

        const card = el("section", "series");
        const head = el("div", "series-head");
        head.append(
          el("h2", "series-title", s.title),
          el("span", "series-count", `${missing.length} missing`)
        );
        card.append(head, el("p", "ranges", `Volumes ${ranges(missing)}`));
        list.append(card);
      });

      document.getElementById("total").textContent = `${missingTotal} volumes missing from your series`;

      if (!list.children.length) {
        list.append(el("p", "empty", !data.length
          ? EMPTY_TEXT
          : missingTotal ? "No series match your search."
          : "Nothing missing. Every volume you listed is on your shelf."));
      }
    }

    /* ---------- Add series, backup, search, modes ---------- */

    document.getElementById("add-form").onsubmit = e => {
      e.preventDefault();
      const title = document.getElementById("title").value.trim();
      const count = parseInt(document.getElementById("count").value);
      data.push({ title, owned: Array(count).fill(false), read: Array(count).fill(false) });
      e.target.reset();
      save();
    };

    document.getElementById("export").onclick = () => {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "manga-backup-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
    };

    document.getElementById("import").onclick = () => document.getElementById("import-file").click();

    document.getElementById("import-file").onchange = e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const imported = JSON.parse(reader.result);
          if (!Array.isArray(imported)) throw new Error("bad format");
          if (confirm("This will replace your current collection. Continue?")) {
            data = imported;
            data.forEach(s => { if (!s.owned) s.owned = s.read.map(() => true); });
            save();
          }
        } catch {
          alert("This file is not a valid backup.");
        }
        e.target.value = "";
      };
      reader.readAsText(file);
    };

    document.getElementById("search").oninput = render;
    document.getElementById("filter").onchange = render;
    document.querySelectorAll(".modes button").forEach(b => {
      b.onclick = () => { mode = b.dataset.mode; render(); };
    });

    /* ---------- Login ---------- */

    function showAuth() {
      document.getElementById("login-form").hidden = !!user;
      document.getElementById("logout").hidden = !user;
      document.getElementById("auth-status").textContent = user
        ? `Logged in as ${user.email}`
        : "Not logged in. Your data stays on this device only.";
    }

    document.getElementById("login-form").onsubmit = async e => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const { error } = await db.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: location.origin + location.pathname }
      });
      document.getElementById("auth-status").textContent = error
        ? `Error: ${error.message}`
        : "Check your email and click the link.";
    };

    document.getElementById("logout").onclick = async () => { await db.auth.signOut(); };

    /* ---------- Cloud sync ---------- */

    function setSyncStatus(msg) {
      document.getElementById("sync-status").textContent = msg;
    }

    function pushSoon() {
      if (!user) return;
      clearTimeout(pushTimer);
      setSyncStatus("Saving…");
      pushTimer = setTimeout(push, 800);
    }

    async function push() {
      let stamp = localStorage.getItem("manga_updated");
      if (!stamp) {
        stamp = new Date().toISOString();
        localStorage.setItem("manga_updated", stamp);
      }
      const { error } = await db.from("collections").upsert({
        user_id: user.id,
        data,
        updated_at: stamp
      });
      setSyncStatus(error ? `Sync error: ${error.message}` : "Synced ✓");
    }

    async function pull() {
      setSyncStatus("Syncing…");
      const { data: row, error } = await db
        .from("collections")
        .select("data, updated_at")
        .eq("user_id", user.id)
        .maybeSingle();
      if (error) { setSyncStatus(`Sync error: ${error.message}`); return; }

      const localStamp = localStorage.getItem("manga_updated") || "1970-01-01T00:00:00.000Z";

      if (!row) { await push(); return; } // first time: upload this device's data

      const cloudTime = new Date(row.updated_at);
      const localTime = new Date(localStamp);

      if (data.length === 0 || cloudTime > localTime) {
        localStorage.setItem("manga_before_sync", JSON.stringify(data)); // safety copy
        data = row.data;
        data.forEach(s => { if (!s.owned) s.owned = s.read.map(() => true); });
        localStorage.setItem("manga", JSON.stringify(data));
        localStorage.setItem("manga_updated", row.updated_at);
        render();
        setSyncStatus("Synced ✓ (loaded from cloud)");
      } else if (cloudTime < localTime) {
        await push();
      } else {
        setSyncStatus("Synced ✓");
      }
    }

    db.auth.onAuthStateChange((event, session) => {
      user = session ? session.user : null;
      showAuth();
      if (!user) setSyncStatus("");
      if (user && (event === "INITIAL_SESSION" || event === "SIGNED_IN")) setTimeout(pull, 0);
    });

    /* ---------- Barcode scanner (step 1: read and show the ISBN) ---------- */

    // An ISBN-13 starts with 978 or 979 and ends with a check digit.
    // Checking it ignores other barcodes and misreads, and scanning carries on.
    function isValidIsbn13(code) {
      if (!/^97[89]\d{10}$/.test(code)) return false;
      let sum = 0;
      for (let i = 0; i < 12; i++) sum += Number(code[i]) * (i % 2 === 0 ? 1 : 3);
      return (10 - (sum % 10)) % 10 === Number(code[12]);
    }

    const scanner = document.getElementById("scanner");
    const scanVideo = document.getElementById("scan-video");
    let scanStream = null;
    let scanLoop = null;

    function setScanStatus(msg) {
      document.getElementById("scan-status").textContent = msg;
    }

    function stopScanner() {
      clearTimeout(scanLoop);
      if (scanStream) {
        scanStream.getTracks().forEach(t => t.stop());
        scanStream = null;
      }
      scanVideo.srcObject = null;
    }

    async function startScanner() {
      document.getElementById("scan-result").textContent = "";
      document.getElementById("scan-again").hidden = true;

      if (!("BarcodeDetector" in window)) {
        setScanStatus("This browser can't read barcodes. Try Chrome on your Android phone.");
        return;
      }

      let detector;
      try {
        detector = new BarcodeDetector({ formats: ["ean_13"] });
      } catch {
        setScanStatus("This browser can't read this type of barcode.");
        return;
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
      } catch {
        setScanStatus("Camera access is blocked. Allow the camera for this site in your browser settings, then try again.");
        return;
      }

      if (!scanner.open) { // the dialog was closed while waiting for the camera
        stream.getTracks().forEach(t => t.stop());
        return;
      }

      scanStream = stream;
      scanVideo.srcObject = stream;
      try {
        await scanVideo.play();
      } catch {
        return; // interrupted, for example because the dialog was closed
      }
      if (!scanStream) return;
      setScanStatus("Point the camera at the barcode on the back cover.");

      const tick = async () => {
        if (!scanStream) return;
        try {
          const codes = await detector.detect(scanVideo);
          const isbn = codes.map(c => c.rawValue).find(isValidIsbn13);
          if (isbn) { onScanned(isbn); return; }
        } catch {}
        scanLoop = setTimeout(tick, 250);
      };
      tick();
    }

    function onScanned(isbn) {
      stopScanner();
      if (navigator.vibrate) navigator.vibrate(80);
      document.getElementById("scan-result").textContent = isbn;
      setScanStatus("ISBN found.");
      document.getElementById("scan-again").hidden = false;
    }

    document.getElementById("scan-open").onclick = () => { scanner.showModal(); startScanner(); };
    document.getElementById("scan-again").onclick = startScanner;
    document.getElementById("scan-close").onclick = () => scanner.close();
    scanner.addEventListener("close", stopScanner);

    showAuth();
    render();
  </script>
</body>
</html>
