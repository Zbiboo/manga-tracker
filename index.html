<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EEF0F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0F1F" media="(prefers-color-scheme: dark)">
  <title>Manga Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="inventory">
  <main>
    <header>
      <h1>My manga collection</h1>
      <p id="total"></p>
      <p id="summary" class="muted"></p>
      <p id="sync-status" class="muted"></p>
    </header>

    <details class="panel">
      <summary>Account and tools</summary>
      <div class="panel-body">
        <div id="auth">
          <form id="login-form">
            <input id="email" type="email" placeholder="Your email" autocomplete="email" required>
            <button class="btn primary">Send login link</button>
          </form>
          <p id="auth-status" class="muted"></p>
          <button id="logout" class="btn" type="button" hidden>Log out</button>
        </div>

        <form id="add-form">
          <input id="title" placeholder="Series title" required>
          <input id="count" type="number" min="1" inputmode="numeric" placeholder="Total volumes" required>
          <button class="btn primary">Add series</button>
        </form>

        <div class="row">
          <button id="export" class="btn" type="button">Export backup</button>
          <button id="import" class="btn" type="button">Import backup</button>
          <input type="file" id="import-file" accept=".json" hidden>
        </div>
        <div class="row">
          <button id="find-covers" class="btn" type="button">Find missing covers</button>
        </div>
        <p id="covers-status" class="muted" role="status"></p>
      </div>
    </details>

    <div class="controls">
      <input id="search" type="search" placeholder="Search a series">
      <div class="control-row">
        <button id="scan-open" class="btn" type="button">Scan a barcode</button>
        <button id="toggle-all" class="btn" type="button">Expand all</button>
      </div>
      <label class="filter-row"><input type="checkbox" id="filter"> Only series with unread volumes</label>
    </div>

    <div id="list"></div>
  </main>

  <nav class="modes" aria-label="View">
    <button type="button" data-mode="inventory">Inventory</button>
    <button type="button" data-mode="reading">Reading</button>
    <button type="button" data-mode="missing">Missing</button>
  </nav>

  <dialog id="scanner">
    <h2>Scan a barcode</h2>
    <video id="scan-video" playsinline muted></video>
    <p id="scan-status" class="muted">Point the camera at the barcode on the back cover.</p>
    <p id="scan-result" class="scan-result"></p>
    <form id="scan-confirm" class="scan-confirm" hidden>
      <label>Series
        <select id="scan-series"></select>
      </label>
      <input id="scan-newname" placeholder="New series name" aria-label="New series name" hidden>
      <label>Volume
        <input id="scan-volume" type="number" min="1" max="999" inputmode="numeric">
      </label>
      <button class="btn primary" type="submit">Add to my shelf</button>
    </form>
    <p id="scan-saved" class="muted" role="status"></p>
    <div class="row">
      <button id="scan-again" class="btn" type="button" hidden>Scan another</button>
      <button id="scan-close" class="btn primary" type="button">Close</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
